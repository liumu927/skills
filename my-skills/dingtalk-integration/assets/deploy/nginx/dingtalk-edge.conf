# 边界中间件 nginx 前置（形态 B 落盘 + 拉取）
#
# 放到 /etc/nginx/conf.d/dingtalk-edge.conf
# 前置：证书就位、relay 已 systemd 起在 127.0.0.1:4330
# 改完必须 nginx -t && systemctl reload nginx

# 限流：按来源 IP，10r/s，突发 20。钉钉重推集中时不要卡太死。
limit_req_zone $binary_remote_addr zone=dt_inbound:10m rate=10r/s;

# 只允许钉钉出口 IP 时可在这里加 geo/allow（钉钉出口 IP 不固定，慎用；优先靠令牌）
server {
    listen 443 ssl;
    http2 on;
    server_name <domain>;

    ssl_certificate     /etc/nginx/certs/<domain>.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/<domain>.key;

    # 只上 TLS1.2/1.3；钉钉侧校验证书，自签不可用
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dt_ssl:10m;
    ssl_session_timeout 1h;

    server_tokens off;
    client_max_body_size 256k;          # 与 relay MAX_BODY_BYTES 对齐
    client_body_timeout 10s;
    client_header_timeout 10s;

    access_log /var/log/nginx/dingtalk-edge.access.log;
    error_log  /var/log/nginx/dingtalk-edge.error.log warn;

    # ---------- 钉钉侧：入库 ----------
    location ~ ^/api/inbound/[A-Za-z0-9_-]+/(upsert|delete|revoke)$ {
        limit_req zone=dt_inbound burst=20 nodelay;
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout    6s;       # 落盘型：毫秒级，给足余量仍远小于钉钉 5s 级超时
        proxy_read_timeout    6s;
    }

    # ---------- 内网侧：拉取/确认 ----------
    location ~ ^/api/(pull|ack)/[A-Za-z0-9_-]+$ {
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;      # 长轮询改造时改为 60s 以上
    }

    # ---------- 运维接口：只允许内网/白名单 ----------
    location /api/admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://127.0.0.1:4330;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:4330;
    }

    # 其余一律 404（公网暴露面最小化）
    location / {
        return 404;
    }
}

# 80 端口只做跳转或直接关闭。公网对 HTTP 无需求时建议不监听 80。
server {
    listen 80;
    server_name <domain>;
    return 301 https://$host$request_uri;
}
